name: assignment-test
concurrency:
    group: assignment-test-${{ github.repository }}
    cancel-in-progress: false
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
    unit-test:
        container: cuaesd/aesd-autotest:24-unit-test
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Run unit test
            run: ./unit-test.sh
    full-test:
        needs: unit-test
        container: cuaesd/aesd-autotest:24-assignment5
        runs-on: self-hosted
        timeout-minutes: 15
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Run full test
            run: |
              make -C server check
              ./full-test.sh
